# Static personal site. The public HTTP vhost proxies hellowq.icu to this port.
server {
    listen 127.0.0.1:2000;
    server_name hellowq.icu;

    root /var/www/resume;
    index index.html;
    charset utf-8;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ (^|/)\. {
        deny all;
    }

    location ^~ /docx/ {
        deny all;
    }

    location ~* \.(?:css|js|svg|png|webp|ico)$ {
        try_files $uri =404;
        expires 1h;
    }
}
